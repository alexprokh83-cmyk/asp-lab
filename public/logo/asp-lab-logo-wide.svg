<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <!-- Определения градиентов -->
  <defs>
    <!-- Градиент Blue -> Cyan для нижнего блока -->
    <linearGradient id="electricGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#38C8FF" />
    </linearGradient>
  </defs>

  <g transform="translate(20, 20)">
    <!-- ВЕРХНИЙ БЛОК: Deep Navy (#071A2E) -->
    <path fill="#071A2E" d="M 0 0 H 120 V 40 H 50 V 60 H 0 Z" />
    
    <!-- НИЖНИЙ БЛОК: С мягким градиентом Electric Blue -> Cyan -->
    <path fill="url(#electricGradient)" d="M 0 80 H 70 V 60 H 120 V 120 H 0 Z" />

    <!-- ТЕКСТОВАЯ ЧАСТЬ -->
    <!-- Название: ASP Lab -->
    <text x="150" y="70" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="64" 
          font-weight="700" 
          fill="#071A2E" 
          letter-spacing="-1">
      ASP <tspan font-weight="500">Lab</tspan>
    </text>
    
    <!-- Дескриптор: AI Laboratory -->
    <text x="153" y="108" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="400" 
          fill="#071A2E" 
          opacity="0.8" 
          letter-spacing="0.5">
      AI Laboratory
    </text>
  </g>
</svg>
